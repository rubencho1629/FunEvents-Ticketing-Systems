services:
  postgres:
    image: postgres:16
    container_name: funevents-postgres
    environment:
      POSTGRES_DB: funevents
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - funevents-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d funevents"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  funevents-postgres-data: